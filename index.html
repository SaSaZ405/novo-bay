<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | Landing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* تنظیم ویدیو به عنوان پس‌زمینه زنده و تمام‌صفحه */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* انیمیشن چشمک‌زن / پالس نرم برای تمام دکمه‌ها */
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 15px rgba(255,255,255,0.8); }
            100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
        }
        .pulsing-dot {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between select-none h-screen p-4 overflow-hidden">

    <!-- ویدیوی پس‌زمینه -->
    <video id="bgVideo" autoplay muted loop playsinline webkit-playsinline class="bg-video">
        <source src="video.mp4" type="video/mp4">
        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
    </video>

    <!-- لایه تاریک‌کننده ملایم پس‌زمینه -->
    <div class="absolute inset-0 bg-black/10 pointer-events-none z-0"></div>

    <!-- بالای صفحه خالی و آزاد -->
    <div></div>

    <!-- کانتینر میانی برای دو دکمه کوچک و چشمک‌زن روی خورشید و ماه -->
    <div class="relative w-full max-w-7xl mx-auto flex items-center justify-between px-6 my-auto z-20">

        <!-- دکمه خورشید -->
        <div class="absolute left-4 md:left-12 flex flex-col items-center">
            <div id="sunTooltip" class="hidden mb-2 bg-amber-950/95 text-amber-200 border border-amber-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl backdrop-blur-md shadow-2xl whitespace-nowrap animate-bounce">
                صفحه چالش 🚀
            </div>
            <button onclick="handleButtonClick('sun')" 
                    class="pulsing-dot w-5 h-5 md:w-6 md:h-6 bg-amber-500 hover:bg-amber-400 text-gray-950 rounded-full flex items-center justify-center shadow-xl border border-amber-200 cursor-pointer transition-transform active:scale-90">
                <i class="fa-solid fa-sun text-[9px]"></i>
            </button>
        </div>

        <!-- دکمه ماه -->
        <div class="absolute right-4 md:right-12 flex flex-col items-center">
            <div id="moonTooltip" class="hidden mb-2 bg-sky-950/95 text-sky-200 border border-sky-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl backdrop-blur-md shadow-2xl whitespace-nowrap animate-bounce">
                سایت اصلی 🌐
            </div>
            <button onclick="handleButtonClick('moon')" 
                    class="pulsing-dot w-5 h-5 md:w-6 md:h-6 bg-sky-400 hover:bg-sky-300 text-gray-950 rounded-full flex items-center justify-center shadow-xl border border-sky-200 cursor-pointer transition-transform active:scale-90">
                <i class="fa-solid fa-moon text-[9px]"></i>
            </button>
        </div>

    </div>

    <!-- پنل پایین صفحه: سه دکمه طوسی، کوچک، هم‌اندازه و چشمک‌زن -->
    <div class="relative z-30 w-full max-w-xs mx-auto mb-6 flex items-center justify-center gap-3">
        
        <!-- ۱. دکمه انتخاب زبان (منوی سفارشی با ۸ زبان کامل) -->
        <div class="relative">
            <button onclick="toggleLangMenu()" id="langBtn" class="pulsing-dot bg-gray-700 hover:bg-gray-600 text-gray-200 w-5 h-5 md:w-6 md:h-6 rounded-full font-bold flex items-center justify-center shadow-xl border border-gray-400 cursor-pointer transition text-[9px]" title="انتخاب زبان">
                <i class="fa-solid fa-globe text-[8px]"></i>
            </button>

            <!-- کادر لیست زبان‌ها -->
            <div id="langDropdown" class="hidden absolute bottom-9 right-0 bg-gray-900/95 backdrop-blur-md border border-gray-600 rounded-xl shadow-2xl py-2 w-36 z-50 text-[11px] text-gray-200 text-right">
                <div onclick="setLanguage('fa')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">فارسی</div>
                <div onclick="setLanguage('en')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">English</div>
                <div onclick="setLanguage('zh')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">中文</div>
                <div onclick="setLanguage('ar')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">العربية</div>
                <div onclick="setLanguage('fr')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">Français</div>
                <div onclick="setLanguage('it')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">Italiano</div>
                <div onclick="setLanguage('de')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">Deutsch</div>
                <div onclick="setLanguage('ru')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer transition">Русский</div>
            </div>
        </div>

        <!-- ۲. دکمه پخش/توقف موزیک -->
        <button onclick="toggleAudio()" id="audioBtn" class="pulsing-dot bg-gray-700 hover:bg-gray-600 text-gray-200 w-5 h-5 md:w-6 md:h-6 rounded-full font-bold flex items-center justify-center shadow-xl border border-gray-400 cursor-pointer transition text-[9px]">
            <i id="playIcon" class="fa-solid fa-play text-[8px]"></i>
        </button>

        <!-- ۳. دکمه آهنگ بعدی -->
        <button onclick="nextTrack()" id="nextTrackBtn" class="pulsing-dot bg-gray-700 hover:bg-gray-600 text-gray-200 w-5 h-5 md:w-6 md:h-6 rounded-full font-bold flex items-center justify-center shadow-xl border border-gray-400 cursor-pointer transition text-[9px]" title="آهنگ بعدی">
            <i class="fa-solid fa-music text-[8px]"></i>
        </button>

    </div>

    <!-- فوتر پایین صفحه -->
    <footer class="relative z-20 w-full text-center text-[9px] text-gray-400/60 pb-1" id="footerText">
        NOVO-BAY Platform © 2026
    </footer>

    <!-- اسکریپت‌های کنترلی و ترجمه -->
    <script>
        // دیکشنری کامل متن‌ها برای ۸ زبان
        const translations = {
            fa: { sun: "صفحه چالش 🚀", moon: "سایت اصلی 🌐", footer: "NOVO-BAY Platform © 2026", dir: "rtl" },
            en: { sun: "Challenge Page 🚀", moon: "Main Site 🌐", footer: "NOVO-BAY Platform © 2026", dir: "ltr" },
            zh: { sun: "挑战页面 🚀", moon: "主网站 🌐", footer: "NOVO-BAY 平台 © 2026", dir: "ltr" },
            ar: { sun: "صفحة التحدي 🚀", moon: "الموقع الرئيسي 🌐", footer: "منصة نوفو-باي © 2026", dir: "rtl" },
            fr: { sun: "Page de Défi 🚀", moon: "Site Principal 🌐", footer: "Plateforme NOVO-BAY © 2026", dir: "ltr" },
            it: { sun: "Pagina della Sfida 🚀", moon: "Sito Principale 🌐", footer: "Piattaforma NOVO-BAY © 2026", dir: "ltr" },
            de: { sun: "Herausforderungsseite 🚀", moon: "Hauptseite 🌐", footer: "NOVO-BAY Plattform © 2026", dir: "ltr" },
            ru: { sun: "Страница вызова 🚀", moon: "Главный сайт 🌐", footer: "Платформа NOVO-BAY © 2026", dir: "ltr" }
        };

        let currentLang = localStorage.getItem('novo_lang') || 'fa';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('novo_lang', lang);
            const t = translations[lang] || translations.fa;
            
            // تغییر جهت صفحه (RTL / LTR)
            document.getElementById('htmlRoot').setAttribute('dir', t.dir);
            
            // اعمال فوری متن‌ها روی تپ‌تیپ‌ها و فوتر
            document.getElementById('sunTooltip').innerText = t.sun;
            document.getElementById('moonTooltip').innerText = t.moon;
            document.getElementById('footerText').innerText = t.footer;
            
            // بستن منو پس از انتخاب
            document.getElementById('langDropdown').classList.add('hidden');
        }

        // اعمال زبان ذخیره‌شده به محض لود شدن صفحه
        document.addEventListener("DOMContentLoaded", function() {
            setLanguage(currentLang);
            const video = document.getElementById('bgVideo');
            video.playbackRate = 20.0; 
        });

        let sunClicked = false;
        let moonClicked = false;

        function handleButtonClick(type) {
            const t = translations[currentLang] || translations.fa;
            if (type === 'sun') {
                const tooltip = document.getElementById('sunTooltip');
                tooltip.innerText = t.sun;
                if (!sunClicked) {
                    tooltip.classList.remove('hidden');
                    sunClicked = true;
                    setTimeout(() => { tooltip.classList.add('hidden'); sunClicked = false; }, 4000);
                } else {
                    // هدایت به صفحه چالش به همراه ارسال کد زبان انتخابی در URL
                    window.location.href = "https://sasaz405.github.io/novo-bay-showcase/?lang=" + currentLang;
                }
            } else if (type === 'moon') {
                const tooltip = document.getElementById('moonTooltip');
                tooltip.innerText = t.moon;
                if (!moonClicked) {
                    tooltip.classList.remove('hidden');
                    moonClicked = true;
                    setTimeout(() => { tooltip.classList.add('hidden'); moonClicked = false; }, 4000);
                } else {
                    alert("انتقال به سایت اصلی نووبی...");
                }
            }
        }

        // کنترل منوی سفارشی زبان‌ها
        function toggleLangMenu() {
            const dropdown = document.getElementById('langDropdown');
            dropdown.classList.toggle('hidden');
        }

        // بستن منو با کلیک بیرون از آن
        window.addEventListener('click', function(e) {
            const btn = document.getElementById('langBtn');
            const dropdown = document.getElementById('langDropdown');
            if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        // پخش‌کننده موسیقی
        const playlist = [
            { title: "روز برفی", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "شب‌های زاینده‌رود", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "Experience", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { title: "Nostalgia", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
        ];

        let currentTrackIndex = 0;
        let audioPlayer = new Audio(playlist[currentTrackIndex].src);
        audioPlayer.loop = true;

        /* پخش یا توقف موزیک */
        function toggleAudio() {
            const playIcon = document.getElementById('playIcon');
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    playIcon.className = "fa-solid fa-pause text-[8px]";
                }).catch(err => console.log("خطا در پخش:", err));
            } else {
                audioPlayer.pause();
                playIcon.className = "fa-solid fa-play text-[8px]";
            }
        }

        /* تغییر آهنگ با کلیک روی دکمه موزیک بعدی */
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            const wasPlaying = !audioPlayer.paused;
            audioPlayer.pause();
            audioPlayer = new Audio(playlist[currentTrackIndex].src);
            audioPlayer.loop = true;
            if (wasPlaying) {
                audioPlayer.play().catch(err => console.log("خطا در پخش:", err));
                document.getElementById('playIcon').className = "fa-solid fa-pause text-[8px]";
            }
        }
    </script>
    <script src="C07-audio.js"></script>
</body>
</html>
