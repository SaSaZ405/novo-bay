<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY - Master Grid Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* شبکه شطرنجی ۲۰ سطر در ۱۰ ستون */
        .master-coordinate-grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            pointer-events: none;
            z-index: 10;
        }

        /* سلول‌های راهنمای مختصات شیشه‌ای */
        .grid-node-cell {
            border: 1px dashed rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            overflow: hidden;
        }

        .grid-node-cell:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.6);
            box-shadow: inset 0 0 12px rgba(245, 158, 11, 0.2);
        }

        /* آدرس مختصات شناور روی هر سلول */
        .grid-node-cell::after {
            content: attr(data-coord);
            font-size: 8px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.25);
            font-weight: bold;
            position: absolute;
            bottom: 2px;
            right: 4px;
            pointer-events: none;
        }

        .grid-node-cell:hover::after {
            color: #fbbf24;
            font-size: 10px;
        }

        /* استایل دقیق کانتینرهای المان‌های ثابت */
        #layer-D01, #layer-D07 {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: auto;
        }
    </style>
</head>
<body class="select-none bg-black overflow-hidden relative w-screen h-screen">

    <!-- لایه ۱: پس‌زمینه ویدیو/تصویر مهر و ماه -->
    <div class="absolute inset-0 z-1">
        <video id="bgVideo" autoplay muted loop playsinline class="w-full h-full object-cover">
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <!-- لایه ۲: نقشه شطرنجی شبکه ۲۰ سطر در ۱۰ ستون -->
    <main class="master-coordinate-grid" id="masterGrid">
        <!-- سلول‌ها توسط جاوااسکریپت ساخته می‌شوند -->
    </main>

    <script>
        const gridContainer = document.getElementById('masterGrid');
        
        for (let r = 1; r <= 20; r++) {
            for (let c = 1; c <= 10; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-node-cell';
                cell.setAttribute('data-coord', `R${r}:C${c}`);
                
                // جانمایی D01 دقیقاً در R1:C1 (بالا چپ)
                if (r === 1 && c === 1) {
                    cell.id = 'layer-D01';
                } else if (r === 19 && c === 10) {
                    // جانمایی D07 دقیقاً در R19:C10 (پایین راست)
                    cell.id = 'layer-D07';
                } else {
                    cell.id = `node-R${r}-C${c}`;
                }

                gridContainer.appendChild(cell);
            }
        }
    </script>

    <!-- فراخوانی ماژول‌ها -->
    <script src="D01-translate.js?v=22"></script>
    <script src="D07-audio.js?v=22"></script>
</body>
</html>
