<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | Landing Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="D03-landing-style.css">
</head>
<body class="select-none bg-black">

    <main class="artwork-container">
        
        <!-- تصویر پس‌زمینه خورشید و ماه (نام فایل عکس موجود در مخزن شما: sun-moon.jpg) -->
        <img src="sun-moon.jpg" alt="NOVO-BAY Sun & Moon" class="bg-artwork">

        <!-- هدر بالا برای دکمه ترجمه -->
        <header class="top-header">
            <div class="relative">
                <button onclick="toggleLangMenu()" id="langBtn" class="pulsing-dot bg-gray-800/90 hover:bg-gray-700 text-gray-200 w-8 h-8 rounded-full font-bold flex items-center justify-center shadow-2xl border border-gray-400 cursor-pointer text-xs" title="Language">
                    <i class="fa-solid fa-globe text-xs"></i>
                </button>
                <div id="langDropdown" class="hidden absolute top-10 right-0 bg-gray-900/95 backdrop-blur-md border border-gray-600 rounded-xl shadow-2xl py-2 w-36 z-50 text-[11px] text-gray-200 text-right">
                    <div onclick="setLanguage('fa')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">فارسی</div>
                    <div onclick="setLanguage('en')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">English</div>
                    <div onclick="setLanguage('zh')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">中文</div>
                    <div onclick="setLanguage('ar')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">العربية</div>
                    <div onclick="setLanguage('fr')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">Français</div>
                    <div onclick="setLanguage('it')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">Italiano</div>
                    <div onclick="setLanguage('de')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">Deutsch</div>
                    <div onclick="setLanguage('ru')" class="px-3 py-1.5 hover:bg-gray-700 cursor-pointer">Русский</div>
                </div>
            </div>
        </header>

        <!-- دکمه خورشید دقیقاً روی گونه خورشید -->
        <div class="sun-hotspot flex flex-col items-center">
            <div id="sunTooltip" class="hidden mb-2 bg-amber-950/95 text-amber-200 border border-amber-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl backdrop-blur-md shadow-2xl animate-bounce">
                صفحه چالش 🚀
            </div>
            <button onclick="handleButtonClick('sun')" class="pulsing-dot w-8 h-8 md:w-10 md:h-10 bg-amber-500 hover:bg-amber-400 text-gray-950 rounded-full flex items-center justify-center shadow-2xl border-2 border-amber-200 cursor-pointer">
                <i class="fa-solid fa-sun text-xs md:text-sm"></i>
            </button>
        </div>

        <!-- دکمه ماه دقیقاً روی گونه ماه آبی -->
        <div class="moon-hotspot flex flex-col items-center">
            <div id="moonTooltip" class="hidden mb-2 bg-sky-950/95 text-sky-200 border border-sky-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl backdrop-blur-md shadow-2xl animate-bounce">
                سایت اصلی 🌐
            </div>
            <button onclick="handleButtonClick('moon')" class="pulsing-dot w-8 h-8 md:w-10 md:h-10 bg-sky-400 hover:bg-sky-300 text-gray-950 rounded-full flex items-center justify-center shadow-2xl border-2 border-sky-200 cursor-pointer">
                <i class="fa-solid fa-moon text-xs md:text-sm"></i>
            </button>
        </div>

        <!-- فوتر پایین -->
        <footer class="footer-bar" id="footerText">
            NOVO-BAY Platform © 2026
        </footer>

    </main>

    <script src="D06-landing-logic.js"></script>
    <script src="D07-audio.js?v=3"></script>
</body>
</html>
