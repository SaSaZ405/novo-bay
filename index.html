<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | Landing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* تنظیم ویدیو به عنوان پس‌زمینه زنده و تمام‌صفحه */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* انیمیشن چشمک‌زن / پالس نرم برای تمام دکمه‌ها */
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 15px rgba(255,255,255,0.8); }
            100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
        }
        .pulsing-dot {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between select-none h-screen p-4 overflow-hidden">

    <!-- ویدیوی پس‌زمینه با قابلیت پخش خودکار، حلقه و سرعت بهینه -->
    <video id="bgVideo" autoplay muted loop playsinline webkit-playsinline class="bg-video">
        <source src="video.mp4" type="video/mp4">
        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
    </video>

    <!-- لایه تاریک‌کننده ملایم پس‌زمینه -->
    <div class="absolute inset-0 bg-black/10 pointer-events-none z-0"></div>

    <!-- بالای صفحه خالی و آزاد -->
    <div></div>

    <!-- کانتینر میانی برای دو دکمه کوچک و چشمک‌زن روی خورشید و ماه -->
    <div class="relative w-full max-w-7xl mx-auto flex items-center justify-between px-6 my-auto z-20">

        <!-- دکمه خورشید (کوچک و مینیمال) -->
        <div class="absolute left-4 md:left-12 flex flex-col items-center">
            <div id="sunTooltip" class="hidden mb-2 bg-amber-950/95 text-amber-200 border border-amber-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl backdrop-blur-md shadow-2xl whitespace-nowrap animate-bounce">
                صفحه چالش 🚀
            </div>
            <button onclick="handleButtonClick('sun')" 
                    class="pulsing-dot w-5 h-5 md:w-6 md:h-6 bg-amber-500 hover:bg-amber-400 text-gray-950 rounded-full flex items-center justify-center shadow-xl border border-amber-200 cursor-pointer transition-transform active:scale-90">
                <i class="fa-solid fa-sun text-[9px]"></i>
            </button>
        </div>

        <!-- دکمه ماه (کوچک و مینیمال) -->
        <div class="absolute right-4 md:right-12 flex flex-col items-center">
            <div id="moonTooltip" class="hidden mb-2 bg-sky-950/95 text-sky-200 border border-sky-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl backdrop-blur-md shadow-2xl whitespace-nowrap animate-bounce">
                سایت اصلی 🌐
            </div>
            <button onclick="handleButtonClick('moon')" 
                    class="pulsing-dot w-5 h-5 md:w-6 md:h-6 bg-sky-400 hover:bg-sky-300 text-gray-950 rounded-full flex items-center justify-center shadow-xl border border-sky-200 cursor-pointer transition-transform active:scale-90">
                <i class="fa-solid fa-moon text-[9px]"></i>
            </button>
        </div>

    </div>

    <!-- پنل پایین صفحه: سه دکمه طوسی، کوچک، مجزا و چشمک‌زن -->
    <div class="relative z-20 w-full max-w-xs mx-auto mb-6 flex items-center justify-center gap-3">
        
        <!-- ۱. دکمه زبان (طوسی کوچک) -->
        <div class="relative">
            <select id="langSelector" onchange="changeLanguage(this.value)" class="pulsing-dot appearance-none bg-gray-700 hover:bg-gray-600 text-gray-200 border border-gray-400 w-5 h-5 md:w-6 md:h-6 rounded-full text-[9px] font-bold text-center outline-none cursor-pointer shadow-xl transition flex items-center justify-center" style="text-align-last: center;">
                <option value="fa">FA</option>
                <option value="en">EN</option>
                <option value="zh">ZH</option>
                <option value="ru">RU</option>
                <option value="ar">AR</option>
                <option value="fr">FR</option>
                <option value="de">DE</option>
            </select>
        </div>

        <!-- ۲. دکمه پخش/توقف موزیک (طوسی کوچک) -->
        <button onclick="toggleAudio()" id="audioBtn" class="pulsing-dot bg-gray-700 hover:bg-gray-600 text-gray-200 w-5 h-5 md:w-6 md:h-6 rounded-full font-bold flex items-center justify-center shadow-xl border border-gray-400 cursor-pointer transition text-[9px]">
            <i id="playIcon" class="fa-solid fa-play text-[8px]"></i>
        </button>

        <!-- ۳. دکمه آهنگ بعدی (طوسی کوچک) -->
        <button onclick="nextTrack()" id="nextTrackBtn" class="pulsing-dot bg-gray-700 hover:bg-gray-600 text-gray-200 w-5 h-5 md:w-6 md:h-6 rounded-full font-bold flex items-center justify-center shadow-xl border border-gray-400 cursor-pointer transition text-[9px]" title="آهنگ بعدی">
            <i class="fa-solid fa-music text-[8px]"></i>
        </button>

    </div>

    <!-- فوتر پایین صفحه -->
    <footer class="relative z-20 w-full text-center text-[9px] text-gray-400/60 pb-1">
        NOVO-BAY Platform © 2026
    </footer>

    <!-- اسکریپت‌های کنترلی -->
    <script>
        // تنظیم سرعت مناسب برای ویدیو
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById('bgVideo');
            video.playbackRate = 1.3; 
        });

        let sunClicked = false;
        let moonClicked = false;

        function handleButtonClick(type) {
            if (type === 'sun') {
                const tooltip = document.getElementById('sunTooltip');
                if (!sunClicked) {
                    tooltip.classList.remove('hidden');
                    sunClicked = true;
                    setTimeout(() => { tooltip.classList.add('hidden'); sunClicked = false; }, 4000);
                } else {
                    window.location.href = "https://sasaz405.github.io/novo-bay-showcase/";
                }
            } else if (type === 'moon') {
                const tooltip = document.getElementById('moonTooltip');
                if (!moonClicked) {
                    tooltip.classList.remove('hidden');
                    moonClicked = true;
                    setTimeout(() => { tooltip.classList.add('hidden'); moonClicked = false; }, 4000);
                } else {
                    alert("انتقال به سایت اصلی نووبی...");
                }
            }
        }

        // پخش‌کننده موسیقی
        const playlist = [
            { title: "روز برفی", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "شب‌های زاینده‌رود", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "Experience", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { title: "Nostalgia", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
        ];

        let currentTrackIndex = 0;
        let audioPlayer = new Audio(playlist[currentTrackIndex].src);
        audioPlayer.loop = true;

        /* پخش یا توقف موزیک */
        function toggleAudio() {
            const playIcon = document.getElementById('playIcon');
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    playIcon.className = "fa-solid fa-pause text-[8px]";
                }).catch(err => console.log("خطا در پخش:", err));
            } else {
                audioPlayer.pause();
                playIcon.className = "fa-solid fa-play text-[8px]";
            }
        }

        /* تغییر آهنگ با کلیک روی دکمه موزیک بعدی */
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            const wasPlaying = !audioPlayer.paused;
            audioPlayer.pause();
            audioPlayer = new Audio(playlist[currentTrackIndex].src);
            audioPlayer.loop = true;
            if (wasPlaying) {
                audioPlayer.play().catch(err => console.log("خطا در پخش:", err));
                document.getElementById('playIcon').className = "fa-solid fa-pause text-[8px]";
            }
            console.log("آهنگ فعلی:", playlist[currentTrackIndex].title);
        }

        function changeLanguage(lang) {
            console.log("Language changed to:", lang);
        }
    </script>
</body>
</html>
