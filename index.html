<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY - Master Grid Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .grid-wrapper {
            position: absolute;
            inset: 0;
            padding: 12px;
            box-sizing: border-box;
            z-index: 10;
        }

        .master-coordinate-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            pointer-events: none;
            box-sizing: border-box;
        }

        .grid-node-cell {
            border: 1px dashed rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-sizing: border-box;
            overflow: visible !important; 
        }

        .grid-node-cell:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.6);
            box-shadow: inset 0 0 12px rgba(245, 158, 11, 0.2);
        }

        .grid-node-cell::after {
            content: attr(data-coord);
            font-size: 8px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.25);
            font-weight: bold;
            position: absolute;
            bottom: 2px;
            right: 4px;
            pointer-events: none;
        }

        .grid-node-cell:hover::after {
            color: #fbbf24;
            font-size: 10px;
        }

        .balloon-element {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            z-index: 60;
            white-space: nowrap;
        }

        #layer-D01 .balloon-element {
            top: 0;
            left: 0;
            transform: translate(0, 0);
        }

        #layer-D07 .balloon-element {
            bottom: 0;
            right: 0;
            top: auto;
            left: auto;
            transform: translate(0, 0);
        }

        /* استایل کارت سفید یخی توضیحات (Ice-Glass Modal) */
        .ice-glass-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .ice-glass-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .ice-glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border-radius: 1.5rem;
            color: #0f172a;
            max-width: 90vw;
            width: 420px;
            padding: 1.5rem;
        }
    </style>
</head>
<body class="select-none bg-black overflow-hidden relative w-screen h-screen">

    <!-- لایه ۱: پس‌زمینه تصویر/ویدیو (مهر و ماه) -->
    <div class="absolute inset-0 z-1">
        <video id="bgVideo" autoplay muted loop playsinline class="w-full h-full object-cover">
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <!-- لایه ۲: محفظه دارای فضای امن + شبکه ۲۰۰ سلولی -->
    <div class="grid-wrapper">
        <main class="master-coordinate-grid" id="masterGrid">
            <!-- سلول‌ها توسط جاوااسکریپت ساخته می‌شوند -->
        </main>
    </div>

    <!-- لایه ۳: مودال سفید یخی توضیحات -->
    <div id="iceGlassModal" class="ice-glass-overlay">
        <div class="ice-glass-card text-right relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-800 transition-colors">
                <i class="fas fa-times text-lg"></i>
            </button>
            <h3 id="modalTitle" class="text-xl font-bold mb-3 text-slate-900">اطلاعات سلول</h3>
            <p id="modalDesc" class="text-sm leading-relaxed text-slate-600 mb-4">توضیحات و محتوای مربوط به این موقعیت در این لایه شیشه‌ای قرار می‌گیرد.</p>
            <div id="modalFooter" class="flex justify-end gap-2 pt-2 border-t border-slate-200/60">
                <button onclick="closeModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all shadow-md">تایید</button>
            </div>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('masterGrid');
        
        for (let r = 1; r <= 20; r++) {
            for (let c = 1; c <= 10; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-node-cell';
                cell.setAttribute('data-coord', `R${r}:C${c}`);
                
                if (r === 1 && c === 1) {
                    cell.id = 'layer-D01';
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon-element';
                    cell.appendChild(balloon);
                } else if (r === 19 && c === 10) {
                    cell.id = 'layer-D07';
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon-element';
                    cell.appendChild(balloon);
                } else {
                    cell.id = `node-R${r}-C${c}`;
                }

                // رویداد کلیک برای نمایش کارت سفید یخی توضیحات
                cell.addEventListener('click', (e) => {
                    // اگر کلیک روی کنترل‌های داخلی پلیر یا ترجمه بود، تداخل ایجاد نکند
                    if (e.target.closest('#layer-D07') && !e.target.classList.contains('grid-node-cell')) {
                        return;
                    }
                    
                    let title = `مختصات سلول: R${r}:C${c}`;
                    let desc = `این سلول در موقعیت سطر ${r} و ستون ${c} قرار دارد.`;
                    
                    if (r === 1 && c === 1) {
                        title = "ماژول فرماندهی مرکزی: مدیریت زبان و ترجمه";
                        desc = "این سلول (R1:C1) به عنوان هسته کنترل دیپلماسی زبانی و پورتال‌های ترجمه ملل عمل می‌کند.";
                    } else if (r === 19 && c === 10) {
                        title = "ماژول فرماندهی مرکزی: صوت، موسیقی و آوای ملل";
                        desc = "این سلول (R19:C10) کنترل‌کننده فضای صوتی، موزیک‌های پس‌زمینه و پلتفرم شنیداری شبکه است.";
                    }

                    openModal(title, desc);
                });

                gridContainer.appendChild(cell);
            }
        }

        function openModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('iceGlassModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('iceGlassModal').classList.remove('active');
        }
    </script>

    <!-- فراخوانی ماژول‌ها -->
    <script src="D01-translate.js?v=26"></script>
    <script src="D07-audio.js?v=26"></script>
</body>
</html>
