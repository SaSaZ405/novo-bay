<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070b;
        }

        /* پس‌زمینه تمام صفحه با تصویر خورشید و ماه */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        /* آیکون بسیار کوچک انتخاب زبان در گوشه بالای صفحه */
        .lang-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
        }

        .lang-switcher {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }

        /* دکمه‌های گرد چشمک‌زن روی گونه‌ها */
        .pulse-btn {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 10;
            animation: pulse-glow 2s infinite;
        }

        /* دکمه روی گونه خورشید (منتهاالیه سمت چپ تصویر) */
        .sun-cheek-btn {
            top: 55%;
            left: 22%;
            background: radial-gradient(circle, #ffcc00 0%, #ff6600 100%);
            box-shadow: 0 0 12px #ff9900;
        }

        /* دکمه روی گونه ماه (منتهاالیه سمت راست تصویر) */
        .moon-cheek-btn {
            top: 51%;
            left: 78%;
            background: radial-gradient(circle, #a5f3fc 0%, #38bdf8 100%);
            box-shadow: 0 0 12px #38bdf8;
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            70% {
                transform: scale(1.15);
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        /* پاپ‌آپ کوچک مینیمال برای نمایش عنوان (چالش / وب‌سایت) روی دکمه‌ها */
        .tooltip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .pulse-btn:hover .tooltip {
            opacity: 1;
        }

        /* پنل چالش و نقشه (مخفی در ابتدا) */
        .map-game-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 11, 0.92);
            backdrop-filter: blur(12px);
            z-index: 50;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
        }

        .game-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #1f2937;
            margin-bottom: 20px;
            max-width: 600px;
            margin: 20px auto;
        }

        .timer-box {
            font-size: 13px;
            color: #f59e0b;
            font-weight: bold;
        }

        .word-input-box {
            display: flex;
            gap: 8px;
            flex: 1;
            margin-right: 15px;
        }

        .word-input-box input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 14px;
        }

        .word-input-box button {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .map-placeholder {
            width: 100%;
            max-width: 600px;
            height: 350px;
            margin: 0 auto;
            background: #111827;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #9ca3af;
            font-size: 14px;
            border: 1px dashed #374151;
        }

        .back-btn {
            display: block;
            width: max-content;
            margin: 20px auto 0;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- منوی زبان بسیار کوچک در گوشه بالای صفحه -->
    <div class="lang-container">
        <select class="lang-switcher" id="langSelect" onchange="changeLanguage()">
            <option value="fa">فارسی</option>
            <option value="en">English</option>
            <option value="ar">العربية (الإمارات)</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
        </select>
    </div>

    <!-- پس‌زمینه تصویر خورشید و ماه (تمام صفحه) -->
    <div class="bg-container">
        <img src="sun-moon.jpg" alt="NOVO-BAY Universe">
        
        <!-- دکمه روی گونه خورشید (منتهاالیه سمت چپ) -->
        <button class="pulse-btn sun-cheek-btn" onclick="openChallenge()">
            <span class="tooltip">چالش</span>
        </button>

        <!-- دکمه روی گونه ماه (منتهاالیه سمت راست) -->
        <button class="pulse-btn moon-cheek-btn" onclick="openWebsite()">
            <span class="tooltip">وب‌سایت</span>
        </button>
    </div>

    <!-- پنل بازی چالش -->
    <div class="map-game-panel" id="mapGamePanel">
        <div class="game-bar">
            <div class="timer-box">
                ⏳ دور: <span id="roundCount">۱</span> | <span id="timer">59:59</span>
            </div>
            <div class="word-input-box">
                <input type="text" id="userWord" placeholder="کلمه خود را بنویسید...">
                <button onclick="submitWord()">ثبت</button>
            </div>
        </div>
        <div class="map-placeholder">
            [ نمای نقشه تعاملی و نمودار زنده کلمات ]
        </div>
        <button class="back-btn" onclick="closeChallenge()">بازگشت به صفحه اصلی</button>
    </div>

    <script>
        function openChallenge() {
            document.getElementById('mapGamePanel').style.display = 'block';
            startTimer();
        }

        function closeChallenge() {
            document.getElementById('mapGamePanel').style.display = 'none';
        }

        function openWebsite() {
            alert("انتقال به وب‌سایت اصلی...");
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            console.log("Language changed to: " + lang);
        }

        function submitWord() {
            let word = document.getElementById('userWord').value;
            if(word.trim() !== "") {
                alert("کلمه ثبت شد: " + word);
                document.getElementById('userWord',).value = "";
            }
        }

        let timerInterval;
        function startTimer() {
            if(timerInterval) return;
            let totalSeconds = 3600;
            let rounds = 1;
            timerInterval = setInterval(() => {
                let minutes = Math.floor(totalSeconds / 60);
                let seconds = totalSeconds % 60;
                document.getElementById('timer').innerText = 
                    (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
                
                totalSeconds--;
                if (totalSeconds < 0) {
                    totalSeconds = 3600;
                    rounds++;
                    document.getElementById('roundCount').innerText = rounds;
                }
            }, 1000);
        }
    </script>

</body>
</html>
