<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVO-BAY - Master Grid Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body { width: 100%; height: 100dvh; margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        .bg-wallpaper { position: fixed; inset: 0; top: 12.5dvh; bottom: 45px; background: url('sun-moon.jpg') center/cover no-repeat; z-index: 1; }
        .grid-wrapper { position: absolute; inset: 12.5dvh 0 45px 0; padding: 4px; z-index: 10; box-sizing: border-box; }
        .master-coordinate-grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(20, 1fr); pointer-events: none; }
        .grid-node-cell { border: 1px dashed rgba(255,255,255,0.04); position: relative; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .grid-node-cell:hover { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.4); }
        .grid-node-cell::after { content: attr(data-coord); font-size: 7px; font-family: monospace; color: rgba(255,255,255,0.15); position: absolute; bottom: 1px; right: 2px; }
        .balloon-element { position: absolute; pointer-events: auto; z-index: 60; }
        #layer-D01 .balloon-element { top: 2px; right: 2px; }
        #layer-D05 .balloon-element { top: 2px; right: 2px; }
        #layer-D04 .balloon-element { top: 2px; left: 2px; }
        #layer-D07 .balloon-element { bottom: 2px; left: 2px; }
        .bottom-control-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 45px; background: rgba(15,23,42,0.92); border-top: 1px solid rgba(245,158,11,0.4); z-index: 99999; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; color: #f8fafc; font-size: 11px; }
        .ice-glass-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(14px); z-index: 100000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; }
        .ice-glass-overlay.active { opacity: 1; visibility: visible; }
        .ice-glass-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-radius: 1.5rem; color: #0f172a; width: 380px; padding: 1.25rem; }
    </style>
</head>
<body class="select-none bg-black relative">

    <div class="bg-wallpaper"><div class="absolute inset-0 bg-black/20"></div></div>

    <div class="grid-wrapper">
        <main class="master-coordinate-grid" id="masterGrid"></main>
    </div>

    <footer class="bottom-control-bar">
        <div class="flex items-center gap-3"><i class="fas fa-circle text-emerald-400 text-[8px] animate-ping"></i> سیستم ماتریکس فعال</div>
        <div class="font-mono text-amber-400">Grid: 20×10 Master | SEC: <span class="text-white">Active</span></div>
    </footer>

    <div id="iceGlassModal" class="ice-glass-overlay">
        <div class="ice-glass-card text-right relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400"><i class="fas fa-times text-lg"></i></button>
            <h3 id="modalTitle" class="text-lg font-bold mb-2 text-slate-900">اطلاعات سلول</h3>
            <p id="modalDesc" class="text-xs text-slate-600 mb-4">توضیحات مربوط به این بخش...</p>
            <button onclick="closeModal()" class="px-4 py-1.5 bg-amber-500 text-white rounded-xl text-xs font-bold">متوجه شدم</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('masterGrid');
        for (let r = 1; r <= 20; r++) {
            for (let c = 1; c <= 10; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-node-cell';
                cell.setAttribute('data-coord', `R${r}:C${c}`);
                if (r === 1 && c === 1) cell.id = 'layer-D01';
                else if (r === 11 && c === 8) cell.id = 'layer-D05';
                else if (r === 11 && c === 2) cell.id = 'layer-D04';
                else if (r === 20 && c === 10) cell.id = 'layer-D07';
                else {
                    cell.id = `node-R${r}-C${c}`;
                    cell.onclick = () => openModal(`مختصات: R${r}:C${c}`, `سلول سطر ${r} و ستون ${c}`);
                }
                if(['layer-D01','layer-D05','layer-D04','layer-D07'].includes(cell.id)) {
                    const b = document.createElement('div'); b.className = 'balloon-element'; cell.appendChild(b);
                }
                grid.appendChild(cell);
            }
        }
        function openModal(t, d) { document.getElementById('modalTitle').innerText = t; document.getElementById('modalDesc').innerText = d; document.getElementById('iceGlassModal').classList.add('active'); }
        function closeModal() { document.getElementById('iceGlassModal').classList.remove('active'); }
    </script>

    <!-- اسکریپت‌های ماژولار پلتفرم -->
    <script src="D09-seasonal-theme.js?v=102"></script>
    <script src="D01-translate.js?v=102"></script>
    <script src="D05-sun-challenge.js?v=102"></script>
    <script src="D04-moon-gallery.js?v=102"></script>
    <script src="D07-audio.js?v=102"></script>
</body>
</html>
