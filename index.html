<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY - Master Grid Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* شبکه شطرنجی ۲۰ سطر در ۱۰ ستون (20 Rows x 10 Columns Grid) */
        .master-coordinate-grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            pointer-events: none;
            z-index: 10;
        }

        /* سلول‌های راهنمای مختصات شیشه‌ای */
        .grid-node-cell {
            border: 1px dashed rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .grid-node-cell:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.6);
            box-shadow: inset 0 0 12px rgba(245, 158, 11, 0.2);
        }

        /* آدرس مختصات شناور روی هر سلول */
        .grid-node-cell::after {
            content: attr(data-coord);
            font-size: 8px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.25);
            font-weight: bold;
        }

        .grid-node-cell:hover::after {
            color: #fbbf24;
            font-size: 10px;
        }

        /* جانمایی اختصاصی المان‌های تثبیت‌شده قبلی */
        .slot-D01 {
            grid-row: 1 / span 2;
            grid-column: 9 / span 2;
            z-index: 50;
            pointer-events: auto;
        }

        .slot-D07 {
            grid-row: 19 / span 2;
            grid-column: 1 / span 3;
            z-index: 50;
            pointer-events: auto;
        }

        /* استایل آیس‌گلس مادری */
        .ice-glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-radius: 1.5rem;
            color: #0f172a;
        }

        .ice-glass-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .ice-glass-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
    </style>
</head>
<body class="select-none bg-black overflow-hidden relative w-screen h-screen">

    <!-- لایه ۱: پس‌زمینه تصویر/ویدیو (مهر و ماه) بدون دفرمه شدن -->
    <div class="absolute inset-0 z-1">
        <video id="bgVideo" autoplay muted loop playsinline class="w-full h-full object-cover">
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <!-- لایه ۲: نقشه شطرنجی شبکه ۲۰ سطر در ۱۰ ستون -->
    <main class="master-coordinate-grid" id="masterGrid">
        <!-- سلول‌های ۲۰x۱۰ به صورت خودکار توسط جاوااسکریپت برای آدرس‌دهی دقیق ساخته می‌شوند -->
    </main>

    <!-- لایه‌های تزریق ماژول‌های قبلی (سر جای ثابت خودشان) -->
    <div id="layer-D01" class="absolute inset-0 pointer-events-none z-50"></div>
    <div id="layer-D07" class="absolute inset-0 pointer-events-none z-50"></div>

    <script>
        // ساخت هوشمند شبکه ۲۰۰ سلولی (۲۰ سطر × ۱۰ ستون) جهت آدرس‌دهی مستقیم سعیده جان
        const gridContainer = document.getElementById('masterGrid');
        for (let r = 1; r <= 20; r++) {
            for (let c = 1; c <= 10; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-node-cell';
                cell.setAttribute('data-coord', `R${r}:C${c}`);
                cell.id = `node-R${r}-C${c}`;
                gridContainer.appendChild(cell);
            }
        }
    </script>

    <!-- فراخوانی ماژول‌های قبلی بدون هیچ‌گونه تغییر -->
    <script src="D01-translate.js?v=20"></script>
    <script src="D07-audio.js?v=20"></script>
</body>
</html>
