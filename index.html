<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | Landing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* تنظیم پس‌زمینه تصویر خورشید و ماه */
        body {
            background-image: url('./sun-moon.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0b0f19;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* انیمیشن چشمک‌زن (پالس) */
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
            50% { transform: scale(1.12); opacity: 1; box-shadow: 0 0 25px rgba(255,255,255,0.8); }
            100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
        }

        .pulsing-btn {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative flex items-center justify-center select-none">

    <!-- لایه تاریک‌کننده ملایم پس‌زمینه برای کنتراست بهتر -->
    <div class="absolute inset-0 bg-black/25 pointer-events-none"></div>

    <!-- کانتینر اصلی صفحه با موقعیت نسبی برای جای‌گذاری دقیق دکمه‌ها روی صورت خورشید و ماه -->
    <div class="relative w-full h-full max-w-5xl mx-auto flex items-center justify-between px-6 md:px-16">

        <!-- دکمه اول: روی صورت خورشید (سمت چپ تصویر) -->
        <a href="https://sasaz405.github.io/novo-bay-showcase/" 
           class="pulsing-btn absolute left-[15%] md:left-[22%] top-[55%] md:top-[50%] -translate-y-1/2 bg-amber-500/90 hover:bg-amber-400 text-gray-950 font-black text-xs md:text-sm py-3 px-5 rounded-2xl shadow-2xl border-2 border-amber-200/60 backdrop-blur-md transition-all flex items-center gap-2 cursor-pointer z-20">
            <i class="fa-solid fa-sun text-amber-950">/i>
            <span>ورود به شوکیس چالش</span>
        </a>

        <!-- دکمه دوم: روی صورت ماه (سمت راست تصویر) -->
        <a href="#more" onclick="alert('گزینه‌های بعدی به زودی اضافه خواهند شد...')" 
           class="pulsing-btn absolute right-[15%] md:right-[22%] top-[35%] md:top-[40%] -translate-y-1/2 bg-sky-400/90 hover:bg-sky-300 text-gray-950 font-black text-xs md:text-sm py-3 px-5 rounded-2xl shadow-2xl border-2 border-sky-200/60 backdrop-blur-md transition-all flex items-center gap-2 cursor-pointer z-20">
            <i class="fa-solid fa-moon text-sky-950"></i>
            <span>بخش‌های آتی</span>
        </a>

    </div>

</body>
</html>
