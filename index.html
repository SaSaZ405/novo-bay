<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | Central Command Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="D03-landing-style.css">
    <style>
        .glass-overlay {
            position: fixed; inset: 0; background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(14px); z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.3s ease-in-out;
        }
        .glass-overlay.active { opacity: 1; visibility: visible; }
        .glass-card {
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(245, 158, 11, 0.2);
            border-radius: 1.5rem; width: 90%; max-width: 580px; padding: 2rem;
            color: #f8fafc; transform: scale(0.95); transition: transform 0.3s ease-in-out;
            text-align: right; direction: rtl;
        }
        .glass-overlay.active .glass-card { transform: scale(1); }
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 16px rgba(255,255,255,0.8); }
            100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 6px rgba(255,255,255,0.4); }
        }
        .pulsing-dot { animation: pulseGlow 2s infinite ease-in-out; }
    </style>
</head>
<body class="select-none bg-black overflow-hidden">

    <video id="bgVideo" autoplay muted loop playsinline webkit-playsinline class="fixed inset-0 w-screen h-screen object-cover z-1">
        <source src="video.mp4" type="video/mp4">
    </video>
    <div class="absolute inset-0 bg-black/10 pointer-events-none z-2"></div>

    <main class="absolute inset-0 z-10 pointer-events-none">
        <!-- دکمه خورشید -->
        <div class="absolute top-[52%] left-[31%] -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-auto flex flex-col items-center">
            <div id="sunTooltip" class="hidden mb-2 bg-amber-950/95 text-amber-200 border border-amber-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl shadow-2xl whitespace-nowrap">صفحه چالش‌های استراتژیک 🚀</div>
            <button onclick="openModal('sun')" onmouseenter="showTooltip('sun')" onmouseleave="hideTooltip('sun')" class="pulsing-dot w-6 h-6 md:w-7 md:h-7 bg-amber-500 hover:bg-amber-400 text-gray-950 rounded-full flex items-center justify-center shadow-2xl border border-amber-200 cursor-pointer">
                <i class="fa-solid fa-sun text-[9px]"></i>
            </button>
        </div>

        <!-- دکمه ماه -->
        <div class="absolute top-[52%] left-[77%] -translate-x-1/2 -translate-y-1/2 z-30 pointer-events-auto flex flex-col items-center">
            <div id="moonTooltip" class="hidden mb-2 bg-sky-950/95 text-sky-200 border border-sky-400/60 text-[10px] font-bold py-1 px-2.5 rounded-xl shadow-2xl whitespace-nowrap">سایت اصلی و گالری 🌐</div>
            <button onclick="openModal('moon')" onmouseenter="showTooltip('moon')" onmouseleave="hideTooltip('moon')" class="pulsing-dot w-6 h-6 md:w-7 md:h-7 bg-sky-400 hover:bg-sky-300 text-gray-950 rounded-full flex items-center justify-center shadow-2xl border border-sky-200 cursor-pointer">
                <i class="fa-solid fa-moon text-[9px]"></i>
            </button>
        </div>

        <!-- کنترلر موسیقی پلیر -->
        <div class="absolute bottom-4 left-4 z-40 pointer-events-auto flex items-center gap-2 bg-gray-900/80 backdrop-blur-md p-2 rounded-xl border border-gray-700">
            <button onclick="openModal('audio')" onmouseenter="showTooltip('audio')" onmouseleave="hideTooltip('audio')" class="text-amber-400 hover:text-amber-300 text-xs px-2 py-1 cursor-pointer flex items-center gap-1.5">
                <i class="fa-solid fa-music"></i>
                <span class="text-[10px]">موزیک پلیر</span>
            </button>
            <div id="audioTooltip" class="hidden absolute bottom-12 left-0 bg-gray-950/95 text-amber-200 border border-amber-500/50 text-[10px] py-1 px-2 rounded-lg whitespace-nowrap shadow-xl">
                مدیریت پخش صوتی و ترک‌های ملل 🎵
            </div>
        </div>

        <footer class="absolute bottom-2 w-full text-center text-[9px] text-white/40 z-20" id="footerText">NOVO-BAY Platform © 2026</footer>
    </main>

    <!-- پنل شیشه‌ای مرکزی -->
    <div id="centralGlassModal" class="glass-overlay">
        <div class="glass-card">
            <div class="flex items-center justify-between mb-4 border-b border-amber-500/30 pb-3">
                <h3 id="modalTitle" class="text-sm md:text-base font-bold text-amber-300 flex items-center gap-2"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition cursor-pointer text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="modalBody" class="space-y-3 text-[11px] md:text-xs text-gray-300 leading-relaxed"></div>
            
            <!-- بخش اختصاصی پیشنهاد موسیقی (فقط در مودال صوت نمایش داده می‌شود) -->
            <div id="musicSuggestionSection" class="hidden mt-4 pt-3 border-t border-gray-700 space-y-2">
                <label class="block text-[11px] font-bold text-amber-300">پیشنهاد موسیقی برای پلتفرم:</label>
                <div class="flex gap-2">
                    <input type="text" id="musicSuggestionInput" placeholder="نام اثر، خواننده یا لینک پیشنهاد..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-gray-200 focus:outline-none focus:border-amber-500">
                    <button onclick="submitUserMusicSuggestion()" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-500 text-gray-950 font-bold rounded-xl text-xs transition cursor-pointer">ارسال پیشنهاد</button>
                </div>
            </div>

            <div class="mt-6 flex items-center justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 transition cursor-pointer">انصراف</button>
                <button id="modalConfirmBtn" onclick="confirmAction()" class="px-5 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-gray-950 transition shadow-lg shadow-amber-500/20 cursor-pointer flex items-center gap-2">
                    <span>پذیرش و ورود</span>
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- بارگذاری فایل صوتی و منطق مرکزی -->
    <script src="D07-audio.js"></script>
    <script>
        let currentActionType = 'sun';

        function showTooltip(type) {
            const tip = document.getElementById(type + 'Tooltip');
            if (tip) tip.classList.remove('hidden');
        }

        function hideTooltip(type) {
            const tip = document.getElementById(type + 'Tooltip');
            if (tip) tip.classList.add('hidden');
        }

        function openModal(type) {
            currentActionType = type;
            const modal = document.getElementById('centralGlassModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            const suggestionSection = document.getElementById('musicSuggestionSection');
            const confirmBtnText = document.querySelector('#modalConfirmBtn span');
            
            // پیش‌فرض مخفی کردن بخش پیشنهاد
            if(suggestionSection) suggestionSection.classList.add('hidden');

            if (type === 'sun') {
                title.innerHTML = '<i class="fa-solid fa-rocket text-amber-400"></i> قوانین و شرایط ورود به چالش‌های نوو-بی';
                body.innerHTML = `
                    <p><strong>هدف پلتفرم:</strong> سنجش مهارت‌های تحلیلی، تصمیم‌گیری در شرایط بحران و حل مسائل پیچیده‌ی شهری و فضایی.</p>
                    <p><strong>روند شرکت:</strong> رویارویی با سناریوهای تعاملی و چالش‌های محاسباتی نیازمند دقت و تفکر سیستمی.</p>
                    <p class="text-amber-200/90 bg-amber-950/40 p-3 rounded-xl border border-amber-500/30 font-medium">با کلیک بر روی دکمه‌ی «پذیرش و ورود»، موافقت خود را با چارچوب علمی و اجرایی این بخش اعلام می‌کنید.</p>
                `;
                if(confirmBtnText) confirmBtnText.innerText = "پذیرش و ورود به چالش";
            } else if (type === 'moon') {
                title.innerHTML = '<i class="fa-solid fa-globe text-sky-400"></i> راهنمای ورود به سایت اصلی';
                body.innerHTML = `
                    <p><strong>معرفی بخش:</strong> ورود به گالری سراسری، مخازن پژوهشی و مستندات اصلی هلدینگ نوو-بی.</p>
                    <p class="text-sky-200/90 bg-sky-950/40 p-3 rounded-xl border border-sky-500/30 font-medium">جهت ورود به محیط عمومی سایت اصلی، روی دکمه تایید کلیک نمایید.</p>
                `;
                if(confirmBtnText) confirmBtnText.innerText = "ورود به سایت اصلی";
            } else if (type === 'audio') {
                title.innerHTML = '<i class="fa-solid fa-music text-amber-400"></i> پروتکل پخش صوتی و موسیقی (NOVO-BAY Audio Lounge)';
                body.innerHTML = `
                    <p>با پخش هر موسیقی در این بخش، شما ملودی‌ها و قطعات شاخصی را از کشورهای مختلفی که زبان‌های آن‌ها در این سایت پشتیبانی می‌شود، خواهید شنید.</p>
                    <p>شما این امکان را دارید که یک موسیقی را به صورت مکرر گوش کنید، اجازه بدهید تمام موسیقی‌ها به نوبت پخش شوند، یا کلا پخش موسیقی را در ابتدای ورود به سایت و یا در هر صفحه‌ای که قرار دارید، غیرفعال کنید.</p>
                    <p class="text-amber-200/90 bg-amber-950/40 p-3 rounded-xl border border-amber-500/30 font-medium">هدف، معرفی موسیقی شاخص کشورهاست. در صورت تمایل می‌توانید پیشنهاد خود را ثبت کنید یا با دکمه‌ی روبرو وارد پنل شوید.</p>
                `;
                // نمایش بخش پیشنهاد موسیقی در مودال صوت
                if(suggestionSection) suggestionSection.classList.remove('hidden');
                if(confirmBtnText) confirmBtnText.innerText = "رد کردن و ورود به پنل موسیقی";
            }

            if (modal) modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('centralGlassModal');
            if (modal) modal.classList.remove('active');
        }

        function confirmAction() {
            const lang = localStorage.getItem('novo_lang') || 'fa';
            if (currentActionType === 'sun') {
                window.location.href = "https://sasaz405.github.io/novo-bay-showcase/?lang=" + lang;
            } else if (currentActionType === 'moon') {
                alert("در حال انتقال به سایت اصلی نووبی...");
                closeModal();
            } else if (currentActionType === 'audio') {
                // فعال‌سازی و پخش موسیقی از طریق ماژول D07
                if (typeof novoAudio !== 'undefined') {
                    novoAudio.togglePlay();
                }
                closeModal();
            }
        }
    </script>
</body>
</html>
