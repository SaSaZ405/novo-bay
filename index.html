<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">NOVO-BAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070b;
        }

        /* پس‌زمینه تمام صفحه با تصویر خورشید و ماه */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        /* منوی زبان در گوشه بالای صفحه */
        .lang-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
        }

        .lang-switcher {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            outline: none;
        }

        /* دکمه‌های گرد چشمک‌زن روی گونه‌ها */
        .pulse-btn {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 10;
            animation: pulse-glow 2s infinite;
        }

        /* دکمه روی گونه خورشید (سمت چپ) -> هدایت به چالش */
        .sun-cheek-btn {
            top: 55%;
            left: 22%;
            background: radial-gradient(circle, #ffcc00 0%, #ff6600 100%);
            box-shadow: 0 0 12px #ff9900;
        }

        /* دکمه روی گونه ماه (سمت راست) -> وب‌سایت اصلی */
        .moon-cheek-btn {
            top: 51%;
            left: 78%;
            background: radial-gradient(circle, #a5f3fc 0%, #38bdf8 100%);
            box-shadow: 0 0 12px #38bdf8;
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            70% {
                transform: scale(1.15);
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        /* راهنما (Tooltip) که با تک‌ضرب ظاهر می‌شود */
        .tooltip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tooltip.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- منوی زبان -->
    <div class="lang-container">
        <select class="lang-switcher" id="langSelect" onchange="changeLanguage()">
            <option value="fa">فارسی</option>
            <option value="en">English</option>
            <option value="ar">العربية (الإمارات)</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
        </select>
    </div>

    <!-- ویجت پخش‌کننده موسیقی -->
<div class="flex items-center bg-white/90 backdrop-blur-md p-1.5 rounded-xl shadow border border-white/50 space-x-2 space-x-reverse">
    <button onclick="toggleAudio()" id="audioBtn" class="interactive-element bg-amber-50 hover:bg-amber-100 p-2 rounded-lg text-xs font-bold flex items-center gap-1.5 text-amber-800 transition">
        <i id="playIcon" class="fa-solid fa-play text-amber-600"></i>
        <span id="audioStatus">پخش موزیک</span>
    </button>
    <select onchange="changeTrack(this.value)" class="text-[11px] font-bold bg-transparent outline-none text-gray-700 cursor-pointer max-w-[130px] truncate">
        <option value="0">🎵 روز برفی (مجید انتظامی)</option>
        <option value="1">🎵 شب‌های زاینده‌رود</option>
        <option value="2">🎼 Experience (Einaudi)</option>
        <option value="3">🎼 Nostalgia (Yanni)</option>
    </select>
</div>

    <!-- پس‌زمینه تصویر خورشید و ماه -->
    <div class="bg-container">
        <img src="sun-moon.jpg" alt="NOVO-BAY Universe">
        
        <!-- دکمه خورشید (چالش) -->
        <button class="pulse-btn sun-cheek-btn" onclick="handleSunClick(event)">
            <span class="tooltip" id="sunTooltip">چالش</span>
        </button>

        <!-- دکمه ماه (وب‌سایت) -->
        <button class="pulse-btn moon-cheek-btn" onclick="handleMoonClick(event)">
            <span class="tooltip" id="moonTooltip">وب‌سایت</span>
        </button>
    </div>

    <script>
        const translations = {
            fa: { challenge: "چالش", website: "وب‌سایت" },
            en: { challenge: "Challenge", website: "Website" },
            ar: { challenge: "تحدي", website: "موقع الكتروني" },
            ru: { challenge: "Вызов", website: "Сайт" },
            zh: { challenge: "挑战", website: "网站" },
            fr: { challenge: "Défi", website: "Site web" },
            de: { challenge: "Herausforderung", website: "Webseite" },
            it: { challenge: "Sfida", website: "Sito web" }
        };

        window.onload = function() {
            const savedLang = localStorage.getItem('novobay_lang') || 'fa';
            document.getElementById('langSelect').value = savedLang;
            applyLanguage(savedLang);
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            localStorage.setItem('novobay_lang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            if (!t) return;

            const htmlRoot = document.getElementById('htmlRoot');
            if (lang === 'fa' || lang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
                htmlRoot.setAttribute('lang', lang);
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
                htmlRoot.setAttribute('lang', lang);
            }

            document.getElementById('sunTooltip').innerText = t.challenge;
            document.getElementById('moonTooltip').innerText = t.website;
        }

        // مدیریت تک‌کلیک (نمایش نام دکمه) و دوبار کلیک (هدایت به لینک چالش) برای خورشید
        let sunClicks = 0;
        let sunTimer = null;
        function handleSunClick(event) {
            event.stopPropagation();
            sunClicks++;
            
            if (sunClicks === 1) {
                document.getElementById('sunTooltip').classList.add('show');
                sunTimer = setTimeout(() => {
                    sunClicks = 0;
                    document.getElementById('sunTooltip').classList.remove('show');
                }, 1500);
            } else if (sunClicks === 2) {
                clearTimeout(sunTimer);
                sunClicks = 0;
                document.getElementById('sunTooltip').classList.remove('show');
                // هدایت دقیق به مخزن شوکیس
                window.location.href = "https://sasaz405.github.io/novo-bay-showcase/";
            }
        }

        // مدیریت تک‌کلیک و دوبار کلیک برای ماه (وب‌سایت اصلی)
        let moonClicks = 0;
        let moonTimer = null;
        function handleMoonClick(event) {
            event.stopPropagation();
            moonClicks++;
            
            if (moonClicks === 1) {
                document.getElementById('moonTooltip').classList.add('show');
                moonTimer = setTimeout(() => {
                    moonClicks = 0;
                    document.getElementById('moonTooltip').classList.remove('show');
                }, 1500);
            } else if (moonClicks === 2) {
                clearTimeout(moonTimer);
                moonClicks = 0;
                document.getElementById('moonTooltip').classList.remove('show');
                alert("شما در حال حاضر در وب‌سایت اصلی هستید.");
            }
        }
    </script>
</body>
</html>
