<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO BAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* 1. قاب اصلی عمودی (شبیه صفحه موبایل 9:16) */
        .phone-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 450px; /* استاندارد عرض موبایل */
            margin: 0 auto;
            overflow: hidden;
        }

        /* 2. ویدیوی پس‌زمینه */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 3. لایه روی ویدیو برای چیدن گل‌میخ‌ها (فعلاً خالی) */
        .interactive-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* 4. استایل ظاهر هر گل‌میخ (برای استفاده‌های بعدی محفوظ است) */
        .stud-button {
            position: absolute;
            width: 28px;  
            height: 28px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .stud-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9));
        }
        .stud-button:active {
            transform: translate(-50%, -50%) scale(0.85);
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- ویدیوی لوپ پس‌زمینه -->
        <video class="bg-video" autoplay muted loop playsinline preload="auto">
            <source src="fireplace-desk.mp4" type="video/mp4">
        </video>

        <!-- نقاط تعاملی گل‌میخ‌ها (فعلاً خالی برای پاک‌سازی) -->
        <div class="interactive-layer">
        </div>
    </div>

    <script>
        // اسکریپت‌ها برای مرحله بعد آماده خواهند شد
    </script>
</body>
</html>
