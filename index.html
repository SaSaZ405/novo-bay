<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | Landing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* تنظیم ویدیو به عنوان پس‌زمینه زنده و تمام‌صفحه */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* انیمیشن چشمک‌زن / پالس نرم برای دکمه‌های دوضربی روی خورشید و ماه */
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 25px rgba(255,255,255,0.9); }
            100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
        }
        .pulsing-dot {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative flex flex-col justify-between select-none h-screen p-4 overflow-hidden">

    <!-- ویدیوی پس‌زمینه با قابلیت پخش خودکار، حلقه مداوم و بدون صدا -->
    <video autoplay muted loop playsinline webkit-playsinline class="bg-video">
        <source src="./video.mp4" type="video/mp4">
        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
    </video>

    <!-- لایه تاریک‌کننده بسیار ملایم برای خوانایی عالی منوها -->
    <div class="absolute inset-0 bg-black/10 pointer-events-none z-0"></div>

    <!-- نوار بالای صفحه: منوی ۷ زبان و پلیر موزیک -->
    <header class="relative z-20 w-full max-w-6xl mx-auto flex items-center justify-between bg-black/40 backdrop-blur-md p-3 rounded-2xl border border-white/15 shadow-xl">
        
        <!-- ۱. منوی انتخاب زبان‌ها -->
        <div class="flex items-center">
            <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-black/70 text-white border border-white/20 px-3 py-1.5 rounded-xl text-xs font-bold outline-none cursor-pointer hover:bg-black transition">
                <option value="fa">فارسی (FA)</option>
                <option value="en">English (EN)</option>
                <option value="zh">中文 (ZH)</option>
                <option value="ru">Русский (RU)</option>
                <option value="ar">العربية (الإمارات)</option>
                <option value="fr">Français (FR)</option>
                <option value="de">Deutsch (DE)</option>
            </select>
        </div>

        <!-- ۲. پخش‌کننده موسیقی -->
        <div class="flex items-center gap-2">
            <button onclick="toggleAudio()" id="audioBtn" class="bg-amber-500 hover:bg-amber-400 text-gray-950 w-8 h-8 rounded-lg font-bold flex items-center justify-center transition shadow cursor-pointer">
                <i id="playIcon" class="fa-solid fa-play text-xs"></i>
            </button>
            <select id="trackSelect" onchange="changeTrack(this.value)" class="text-[11px] font-bold bg-black/70 text-gray-200 border border-white/20 px-2 py-1.5 rounded-xl outline-none cursor-pointer max-w-[140px] md:max-w-[180px] truncate">
                <option value="0">🎵 روز برفی (مجید انتظامی)</option>
                <option value="1">🎵 شب‌های زاینده‌رود</option>
                <option value="2">🎼 Experience (Einaudi)</option>
                <option value="3">🎼 Nostalgia (Yanni)</option>
            </select>
        </div>

    </header>

    <!-- کانتینر میانی برای دو دکمه چشمک‌زن روی خورشید و ماه -->
    <div class="relative w-full max-w-7xl mx-auto flex items-center justify-between px-6 my-auto z-20">

        <!-- دکمه خورشید (منتهی‌الیه سمت چپ - ضربه اول راهنما، ضربه دوم صفحه چالش) -->
        <div class="absolute left-4 md:left-12 flex flex-col items-center">
            <div id="sunTooltip" class="hidden mb-2 bg-amber-950/95 text-amber-200 border border-amber-400/60 text-[11px] font-bold py-1 px-3 rounded-xl backdrop-blur-md shadow-2xl whitespace-nowrap animate-bounce">
                صفحه چالش 🚀
            </div>
            <button onclick="handleButtonClick('sun')" 
                    class="pulsing-dot w-8 h-8 md:w-10 md:h-10 bg-amber-500 hover:bg-amber-400 text-gray-950 rounded-full flex items-center justify-center shadow-2xl border-2 border-amber-200 cursor-pointer transition-transform active:scale-90">
                <i class="fa-solid fa-sun text-xs md:text-sm"></i>
            </button>
        </div>

        <!-- دکمه ماه (منتهی‌الیه سمت راست - ضربه اول راهنما، ضربه دوم سایت اصلی) -->
        <div class="absolute right-4 md:right-12 flex flex-col items-center">
            <div id="moonTooltip" class="hidden mb-2 bg-sky-950/95 text-sky-200 border border-sky-400/60 text-[11px] font-bold py-1 px-3 rounded-xl backdrop-blur-md shadow-2xl whitespace-nowrap animate-bounce">
                سایت اصلی 🌐
            </div>
            <button onclick="handleButtonClick('moon')" 
                    class="pulsing-dot w-8 h-8 md:w-10 md:h-10 bg-sky-400 hover:bg-sky-300 text-gray-950 rounded-full flex items-center justify-center shadow-2xl border-2 border-sky-200 cursor-pointer transition-transform active:scale-90">
                <i class="fa-solid fa-moon text-xs md:text-sm"></i>
            </button>
        </div>

    </div>

    <!-- فوتر پایین صفحه -->
    <footer class="relative z-20 w-full text-center text-[10px] text-gray-400/70 pb-2">
        NOVO-BAY Platform © 2026
    </footer>

    <!-- اسکریپت‌های کنترلی -->
    <script>
        let sunClicked = false;
        let moonClicked = false;

        function handleButtonClick(type) {
            if (type === 'sun') {
                const tooltip = document.getElementById('sunTooltip');
                if (!sunClicked) {
                    tooltip.classList.remove('hidden');
                    sunClicked = true;
                    setTimeout(() => { tooltip.classList.add('hidden'); sunClicked = false; }, 4000);
                } else {
                    window.location.href = "https://sasaz405.github.io/novo-bay-showcase/";
                }
            } else if (type === 'moon') {
                const tooltip = document.getElementById('moonTooltip');
                if (!moonClicked) {
                    tooltip.classList.remove('hidden');
                    moonClicked = true;
                    setTimeout(() => { tooltip.classList.add('hidden'); moonClicked = false; }, 4000);
                } else {
                    alert("انتقال به سایت اصلی نووبی...");
                }
            }
        }

        // پخش‌کننده موسیقی
        const playlist = [
            { title: "روز برفی", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "شب‌های زاینده‌رود", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
            { title: "Experience", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
            { title: "Nostalgia", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
        ];

        let audioPlayer = new Audio(playlist[0].src);
        audioPlayer.loop = true;

        /* پخش یا توقف موزیک */
        function toggleAudio() {
            const playIcon = document.getElementById('playIcon');
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    playIcon.className = "fa-solid fa-pause text-xs";
                }).catch(err => console.log("خطا در پخش:", err));
            } else {
                audioPlayer.pause();
                playIcon.className = "fa-solid fa-play text-xs";
            }
        }

        /* تغییر موزیک از لیست پخش */
        function changeTrack(index) {
            const wasPlaying = !audioPlayer.paused;
            audioPlayer.pause();
            audioPlayer = new Audio(playlist[index].src);
            audioPlayer.loop = true;
            if (wasPlaying) {
                audioPlayer.play();
                document.getElementById('playIcon').className = "fa-solid fa-pause text-xs";
            }
        }

        function changeLanguage(lang) {
            console.log("Language changed to:", lang);
        }
    </script>
</body>
</html>
