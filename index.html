<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | مگا-پلتفرم بین‌المللی و دیپلماسی هوشمند</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ۱. اتاق فرمان و هسته مرکزی مدیریت زبان (به عنوان اولین دستور اجرایی) -->
    <script>
        window.NovoI18n = {
            currentLang: localStorage.getItem('novo_lang') || 'fa',
            
            translations: {
                fa: { systemActive: "سیستم ماتریکس فعال", gridInfo: "Grid: 20×10 Master | SEC: Active" },
                en: { systemActive: "Matrix System Active", gridInfo: "Grid: 20×10 Master | SEC: Active" },
                ru: { systemActive: "Система Matrix Активна", gridInfo: "Grid: 20×10 Master | SEC: Active" },
                ar: { systemActive: "نظام الماتريكس نشط", gridInfo: "Grid: 20×10 Master | SEC: Active" },
                zh: { systemActive: "矩阵系统激活", gridInfo: "Grid: 20×10 Master | SEC: Active" },
                fr: { systemActive: "Système Matrix Actيف", gridInfo: "Grid: 20×10 Master | SEC: Active" },
                de: { systemActive: "Matrix-System Aktiv", gridInfo: "Grid: 20×10 Master | SEC: Active" },
                it: { systemActive: "Sistema Matrix Attivo", gridInfo: "Grid: 20×10 Master | SEC: Active" }
            },

            setGlobalLanguage(langCode) {
                this.currentLang = langCode;
                localStorage.setItem('novo_lang', langCode);
                
                const isRtl = ['fa', 'ar'].includes(langCode);
                document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
                document.documentElement.lang = langCode;

                window.dispatchEvent(new CustomEvent('novoLanguageChanged', { detail: { lang: langCode } }));
                console.log(`[Central Command] Global language switched to: ${langCode}`);
            },

            t(key) {
                const dict = this.translations[this.currentLang] || this.translations['fa'];
                return dict[key] || this.translations['fa'][key] || key;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('novo_lang') || 'fa';
            const isRtl = ['fa', 'ar'].includes(savedLang);
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            document.documentElement.lang = savedLang;
        });
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        /* استایل‌های گرید اصلی و سلول‌ها */
        .master-grid-container {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            grid-template-rows: repeat(20, minmax(0, 1fr));
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 10;
        }
        .grid-cell {
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }
        .grid-cell:hover {
            background: rgba(245, 158, 11, 0.05);
            border-color: rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">

    <!-- ماتریکس اصلی صفحه (20 در 10) -->
    <main class="master-grid-container pt-[12.5dvh] pb-[50px]">
        <!-- سلول‌های کلیدی ماتریکس -->
        <div id="layer-D01" class="grid-cell relative"></div>
        <div id="layer-D02" class="grid-cell relative"></div>
        <div id="layer-D03" class="grid-cell relative"></div>
        <div id="layer-D04" class="grid-cell relative"></div>
        <div id="layer-D05" class="grid-cell relative"></div>
        <div id="layer-D06" class="grid-cell relative"></div>
        <div id="layer-D07" class="grid-cell relative"></div>
        <div id="layer-D08" class="grid-cell relative"></div>
        <div id="layer-D09" class="grid-cell relative"></div>
        <div id="layer-D10" class="grid-cell relative"></div>
    </main>

    <!-- ۲. لود فایل‌های ماژولار در انتهای بدنه برای حفظ امنیت تصویر زمینه و تاچ سلول‌ها -->
    <script src="D09-seasonal-theme.js"></script>
    <script src="D07-audio.js"></script>
    <script src="D01-translate.js"></script>

    <!-- ۳. هماهنگ‌ساز سراسری زبان -->
    <script>
        window.addEventListener('novoLanguageChanged', (e) => {
            console.log("Global language updated across matrix:", e.detail.lang);
        });
    </script>
</body>
</html>
