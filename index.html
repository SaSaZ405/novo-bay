<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVO-BAY - Master Grid Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* استفاده از dvh جهت پوشش کامل ۱۰۰٪ صفحه بدون بیرون زدن سطر R20 در موبایل */
        html, body {
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }

        .grid-wrapper {
            position: absolute;
            inset: 0;
            padding: 6px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* شبکه دقیق ۲۰ سطر در ۱۰ ستون */
        .master-coordinate-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            pointer-events: none;
            box-sizing: border-box;
        }

        /* خطوط مات، محو و بسیار شیک شبکه */
        .grid-node-cell {
            border: 1px dashed rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-sizing: border-box;
            overflow: visible !important; 
        }

        /* درخشش ملایم هنگام Hover */
        .grid-node-cell:hover {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.15);
        }

        /* آدرس‌های بسیار محو که صفحه را شلوغ نکنند */
        .grid-node-cell::after {
            content: attr(data-coord);
            font-size: 7px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.15);
            font-weight: normal;
            position: absolute;
            bottom: 1px;
            right: 2px;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .grid-node-cell:hover::after {
            color: #fbbf24;
            font-weight: bold;
        }

        /* الگوی بالون برای شناورسازی المان‌ها */
        .balloon-element {
            position: absolute;
            pointer-events: auto;
            z-index: 60;
        }

        #layer-D01 .balloon-element {
            top: 2px;
            right: 2px;
        }

        #layer-D07 .balloon-element {
            bottom: 2px;
            left: 2px;
        }

        /* استایل کارت سفید یخی توضیحات (Ice-Glass Modal) */
        .ice-glass-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .ice-glass-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .ice-glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
            color: #0f172a;
            max-width: 88vw;
            width: 380px;
            padding: 1.25rem;
        }
    </style>
</head>
<body class="select-none bg-black relative">

    <!-- لایه ۱: پس‌زمینه تصویر/ویدیو (مهر و ماه) -->
    <div class="absolute inset-0 z-1">
        <video id="bgVideo" autoplay muted loop playsinline class="w-full h-full object-cover">
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <!-- لایه ۲: شبکه ۲۰۰ سلولی کاملاً فیکس از R1 تا R20 -->
    <div class="grid-wrapper">
        <main class="master-coordinate-grid" id="masterGrid">
            <!-- سلول‌ها توسط جاوااسکریپت ساخته می‌شوند -->
        </main>
    </div>

    <!-- لایه ۳: مودال سفید یخی توضیحات -->
    <div id="iceGlassModal" class="ice-glass-overlay">
        <div class="ice-glass-card text-right relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-800 transition-colors">
                <i class="fas fa-times text-lg"></i>
            </button>
            <h3 id="modalTitle" class="text-lg font-bold mb-2 text-slate-900">اطلاعات سلول</h3>
            <p id="modalDesc" class="text-xs leading-relaxed text-slate-600 mb-4">توضیحات مربوط به این بخش در این لایه قرار می‌گیرد.</p>
            <div id="modalFooter" class="flex justify-end gap-2 pt-2 border-t border-slate-200/60">
                <button onclick="closeModal()" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all shadow-md">متوجه شدم</button>
            </div>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('masterGrid');
        
        for (let r = 1; r <= 20; r++) {
            for (let c = 1; c <= 10; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-node-cell';
                cell.setAttribute('data-coord', `R${r}:C${c}`);
                
                if (r === 1 && c === 1) {
                    cell.id = 'layer-D01';
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon-element';
                    cell.appendChild(balloon);
                } else if (r === 19 && c === 10) {
                    cell.id = 'layer-D07';
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon-element';
                    cell.appendChild(balloon);
                } else {
                    cell.id = `node-R${r}-C${c}`;
                }

                // مدیریت باز شدن کارت توضیحات برای همه سلول‌ها از جمله R1:C1 و R19:C10
                cell.addEventListener('click', (e) => {
                    let title = `مختصات سلول: R${r}:C${c}`;
                    let desc = `این سلول در موقعیت سطر ${r} و ستون ${c} از شبکه فرماندهی NOVO-BAY قرار دارد.`;
                    
                    if (r === 1 && c === 1) {
                        title = "سلول فرماندهی D01: دیپلماسی زبانی و ترجمه";
                        desc = "این پورتال مسئولیت هماهنگی زبانی، ترجمه همزمان و اعمال جریمه‌های ساختاری زبان را بر عهده دارد.";
                    } else if (r === 19 && c === 10) {
                        title = "سلول فرماندهی D07: آوای ملل و پلیر صوتی";
                        desc = "این ماژول کنترل‌کننده فضای صوتی، موزیک‌های دیپلماتیک پس‌زمینه و انتشار پیام‌های صوتی شبکه است.";
                    }

                    // اگر روی دکمه‌های کنترلی داخل ماژول کلیک نشد، مودال باز شود
                    if (!e.target.closest('button') && !e.target.closest('.dropdown-menu')) {
                        openModal(title, desc);
                    }
                });

                gridContainer.appendChild(cell);
            }
        }

        function openModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('iceGlassModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('iceGlassModal').classList.remove('active');
        }
    </script>

    <!-- فراخوانی ماژول‌ها -->
    <script src="D01-translate.js?v=27"></script>
    <script src="D07-audio.js?v=27"></script>
</body>
</html>
