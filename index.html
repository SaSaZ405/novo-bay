<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVO-BAY - Master Grid Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }

        .grid-wrapper {
            position: absolute;
            inset: 0;
            padding: 6px;
            box-sizing: border-box;
            z-index: 10;
        }

        .master-coordinate-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            pointer-events: none;
            box-sizing: border-box;
        }

        .grid-node-cell {
            border: 1px dashed rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-sizing: border-box;
            overflow: visible !important; 
        }

        .grid-node-cell:hover {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.15);
        }

        .grid-node-cell::after {
            content: attr(data-coord);
            font-size: 7px;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.15);
            font-weight: normal;
            position: absolute;
            bottom: 1px;
            right: 2px;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .grid-node-cell:hover::after {
            color: #fbbf24;
            font-weight: bold;
        }

        .balloon-element {
            position: absolute;
            pointer-events: auto;
            z-index: 60;
        }

        #layer-D01 .balloon-element {
            top: 2px;
            right: 2px;
        }

        #layer-D07 .balloon-element {
            bottom: 2px;
            left: 2px;
        }

        /* کارت سفید یخی توضیحات (Modal) */
        .ice-glass-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .ice-glass-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .ice-glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
            color: #0f172a;
            max-width: 88vw;
            width: 380px;
            padding: 1.25rem;
        }
    </style>
</head>
<body class="select-none bg-black relative">

    <div class="absolute inset-0 z-1">
        <video id="bgVideo" autoplay muted loop playsinline class="w-full h-full object-cover">
            <source src="video.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/20"></div>
    </div>

    <div class="grid-wrapper">
        <main class="master-coordinate-grid" id="masterGrid">
        </main>
    </div>

    <!-- مودال توضیحات شیشه‌ای پیش‌فرض -->
    <div id="iceGlassModal" class="ice-glass-overlay">
        <div class="ice-glass-card text-right relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-800 transition-colors">
                <i class="fas fa-times text-lg"></i>
            </button>
            <h3 id="modalTitle" class="text-lg font-bold mb-2 text-slate-900">اطلاعات سلول</h3>
            <p id="modalDesc" class="text-xs leading-relaxed text-slate-600 mb-4">توضیحات مربوط به این بخش در این لایه قرار می‌گیرد.</p>
            <div id="modalFooter" class="flex justify-end gap-2 pt-2 border-t border-slate-200/60">
                <button id="modalPrimaryBtn" onclick="closeModal()" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all shadow-md">متوجه شدم</button>
            </div>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('masterGrid');
        
        for (let r = 1; r <= 20; r++) {
            for (let c = 1; c <= 10; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-node-cell';
                cell.setAttribute('data-coord', `R${r}:C${c}`);
                
                if (r === 1 && c === 1) {
                    cell.id = 'layer-D01';
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon-element';
                    cell.appendChild(balloon);
                } else if (r === 19 && c === 10) {
                    cell.id = 'layer-D07';
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon-element';
                    cell.appendChild(balloon);
                } else {
                    cell.id = `node-R${r}-C${c}`;
                }

                cell.addEventListener('click', (e) => {
                    // برای سلول پلیر R19:C10
                    if (r === 19 && c === 10) {
                        openAudioModal();
                        return;
                    }
                    
                    // برای سلول ترجمه R1:C1
                    if (r === 1 && c === 1) {
                        return; // ماژول D01 پاپ‌آپ خودش را باز می‌کند
                    }

                    // برای سایر سلول‌های عادی شبکه
                    openModal(`مختصات سلول: R${r}:C${c}`, `این سلول در موقعیت سطر ${r} و ستون ${c} قرار دارد.`);
                });

                gridContainer.appendChild(cell);
            }
        }

        function openModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            const btn = document.getElementById('modalPrimaryBtn');
            btn.innerText = "متوجه شدم";
            btn.onclick = closeModal;
            document.getElementById('iceGlassModal').classList.add('active');
        }

        // پاپ‌آپ اختصاصی راهنمای صوتی و معرفی پلیر
        function openAudioModal() {
            document.getElementById('modalTitle').innerText = "🎵 راهنمای سیستم صوتی و آوای ملل (NOVO-AUDIO)";
            document.getElementById('modalDesc').innerHTML = `
                این بخش کنترل‌کننده فضای صوتی و موسیقی‌های هویت فرهنگی شبکه NOVO-BAY است.<br><br>
                <span class="text-slate-500">با ورود به این ماژول می‌توانید قطعات صوتی ملل را انتخاب کرده، حالت تکرار را تنظیم کنید یا صدای پس‌زمینه را سفارشی‌سازی نمایید.</span>
            `;
            const btn = document.getElementById('modalPrimaryBtn');
            btn.innerText = "ادامه و تنظیمات صوتی 🎧";
            btn.onclick = () => {
                closeModal();
                if (window.toggleAudioPlaylist) {
                    window.toggleAudioPlaylist(); // باز کردن لیست پخش صوتی اصلی
                }
            };
            document.getElementById('iceGlassModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('iceGlassModal').classList.remove('active');
        }
    </script>

    <!-- فراخوانی ماژول‌ها با کش‌شکنی v=28 -->
    <script src="D01-translate.js?v=28"></script>
    <script src="D07-audio.js?v=28"></script>
</body>
</html>
